server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: taskflow-enterprise
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskflow_db}
    username: ${SPRING_DATASOURCE_USERNAME:taskflow_user}
    password: ${SPRING_DATASOURCE_PASSWORD:taskflow_secret_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

taskflow:
  jwt:
    secret: ${TASKFLOW_JWT_SECRET:c2VjdXJlX2VudGVycHJpc2VfdGFza2Zsb3dfand0X3NlY3JldF9rZXlfMjAyNg==}
    expiration-ms: 86400000
